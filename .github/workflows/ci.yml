name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bats-core yq
      - name: bats
        run: bats tests/foundation/lib
      - name: lints
        run: |
          scripts/lint-i18n.sh
          scripts/lint-locales.sh
          scripts/lint-workflows.sh
      - name: manifest contract, against the fixture platform
        run: scripts/lint-manifest.sh tests/fixtures/fixture-platform
